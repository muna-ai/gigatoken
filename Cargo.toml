# The `.cargo/config.toml` [unstable] opt-in for profile-rustflags only
# applies when cargo runs inside this tree; declaring the feature here too
# lets the manifest parse when gigatoken is consumed as a path dependency
# (nightly cargo either way — the crate needs portable_simd).
cargo-features = ["profile-rustflags"]

[package]
name = "gigatoken"
version = "0.10.0"
edition = "2024"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# muna branch: rlib only. The cdylib (Python wheel target) forces a
# shared-library link even when gigatoken is consumed as a path dependency,
# which requires a working cross linker on every predictor target. Wheels
# build from upstream main, which keeps ["cdylib", "lib"].
[lib]
name = "gigatoken_rs"
crate-type = ["lib"]

# Dev CLI (jsonl encode driver). Compiles bpe_train + the data-ingestion
# modules unconditionally, so it only builds when the full feature set is on;
# feature-trimmed consumers (muna's tokenizers-c) never need it.
[[bin]]
name = "gigatoken"
path = "src/main.rs"
required-features = ["python"]

# Inference consumers (muna's tokenizers-c) build with default-features off:
# they need only tokenizer loading + encode. hub (HF Hub download over TLS),
# data (training-corpus ingestion), and train (BPE training) stay available
# for the Python surface, which enables all three.
[features]
default = ["python"]
python = ["dep:numpy", "dep:pyo3", "data", "hub", "train"]
hub = ["dep:ureq"]
data = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema", "dep:zstd", "dep:flate2"]
train = ["dep:dashmap", "dep:indicatif", "dep:priority-queue", "data"]

[dependencies]
dashmap = { version = "6.1", optional = true }
indicatif = { version = "0.18", optional = true }
itertools = "0.15"
priority-queue = { version = "2.0", optional = true }
# For now uses abi3-py310, should use version-specific ABI in the future
pyo3 = { version = "0.29", features = ["abi3-py310", "eyre"], optional = true }
numpy = { version = "0.29", optional = true }
rayon = "1.11"
rustc-hash = "2.1"
memmap2 = { version = "0.9", features = ["stable_deref_trait"] }
base64 = "0.22"
icu = { version = "2.2", features = ["compiled_data"] }
eyre = "0.6.12"
sonic-rs = "0.5.8"
memchr = "2.8.0"
aho-corasick = "1.1"
serde = { version = "1.0.228", features = ["derive"] }
flate2 = { version = "1.1", optional = true }
zstd = { version = "0.13", optional = true }
spm_precompiled = "0.1.4"
winnow = { version = "1", features = ["simd"] }
parquet = { version = "59.1.0", default-features = false, optional = true, features = [
    "arrow",
    "snap",
    "zstd",
    "flate2",
    "lz4",
    "brotli",
    "flate2-rust_backend",
] }
arrow-array = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
ureq = { version = "3.3.0", default-features = false, optional = true, features = ["rustls"] }

# madvise/prctl on Linux (pretoken cache table, batch gather, bench THP
# setup); already in the tree transitively via memmap2/pyo3.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
lto = "fat"

# Profiling parity: benches keep the release codegen (fat LTO, same inlining)
# but carry full debug info so profilers can resolve inlined frames and source
# lines. Debug info does not change generated code; parity is verified by
# comparing bench throughput against a stripped release build (within noise).
[profile.bench]
inherits = "release"
debug = true
strip = "none"
split-debuginfo = "packed"

[profile.profiling]
inherits = "release"
debug = 2
lto = false
codegen-units = 1
strip = "none"
split-debuginfo = "packed"
# Frame pointers make Instruments' stack unwinding reliable. Mangling is left at
# the toolchain default (v0); `cargo instruments` demangles v0 symbols itself.
rustflags = ["-C", "force-frame-pointers=yes"]

[profile.profiling.package."*"]
debug = 2
strip = "none"

[dev-dependencies]
criterion = "0.8"
fancy-regex = "0.18.0"
rand = "0.10"
simdutf = "0.7.0"
tempfile = "3.27.0"


[[bench]]
name = "pretokenize"
harness = false

[[bench]]
name = "encode"
harness = false
test = false

[[bench]]
name = "encode_st"
harness = false
test = false

[[bench]]
name = "encode_st_sp"
harness = false
test = false

[[bench]]
name = "encode_doc"
harness = false
test = false

[[bench]]
name = "pretokenize_profile"
harness = false
test = false

[[bench]]
name = "pretokenize_profile_all"
harness = false
test = false

[[bench]]
name = "simdutf_transcode"
harness = false

[lints.rust]
unused = "allow"
